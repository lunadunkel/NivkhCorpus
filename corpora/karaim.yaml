id: karaim
enabled: false

name:
  ru: Караимский
  en: Karaim

# Опции <select> справа от строки поиска.
languages:
- { value: karaim, label: Кар, selected: true }
- { value: russian, label: Рус }

search:
  meta_language: russian # значение <select>, означающее язык перевода
  sentence_text_field: russian_text
  translation_field: translation
  lemma_field: lemma
  token_field: token

# Дополнительные буквы под строкой поиска.
keyboard:
- [ ć, ł, ń, ė ]
- [ ö, ś, ż, ü ]

assets:
  styles: []
  scripts: []

pages:
  search:
    template: search.html
    title: Корпус караимского языка — НИВЦ МГУ
    description: >-
      Морфологический поиск по текстам на караимском языке с разбором по частям речи, падежам и временам.
    og_description: >-
      Морфологический поиск по текстам на караимском языке: по словоформе, лемме, части речи, падежу и времени.
    og_image_alt: Караимский корпус — НИВЦ МГУ
    canonical: /karaim

  about:
    template: about/karaim.html
    title: О корпусе караимского языка – НИВЦ МГУ
    description: >-
      Состав корпуса караимского языка, источники текстов, принципы разметки и правила цитирования.
    og_description: >-
      Состав корпуса караимского языка, источники текстов, принципы разметки и правила цитирования.
    og_image_alt: Караимский корпус — НИВЦ МГУ
    canonical: /karaim/about
    styles: [ "about.css" ]
  dictionary:
    template: dictionary.html
    title: Караимско-русский словарь — НИВЦ МГУ
    description: >-
      Словник караимского языка с переводами на русский. Поиск по букве и по лемме.
    og_description: >-
      Словник караимского языка с переводами на русский. Поиск по букве и по лемме.
    og_image_alt: Караимский корпус — НИВЦ МГУ
    canonical: /dictionary
    styles: [ "dictionary.css" ]
  search_output:
    template: search_output.html
    title: Результаты поиска — Караимский корпус НИВЦ МГУ
  word:
    template: word.html
    title: Словарная статья — Караимско-русский словарь
    description: >-
      Значения, переводы и грамматические пометы караимского слова. Караимский языковой корпус. 
    og_description: >-
      Словник караимского языка с переводами на русский. Поиск по букве и по лемме.
    og_image_alt: Караимский корпус — НИВЦ МГУ
    canonical: /dictionary/word
    styles: [ "letter.css" ]
  letter:
    template: letter.html
    title: Словарь по буквам — Караимско-русский словарь
    description: >-
      Список караимских слов на выбранную букву с переводами на русский.
    og_description: >-
      Список караимских слов на выбранную букву с переводами на русский.
    og_image_alt: Караимский корпус — НИВЦ МГУ
    styles: [ "letter.css" ]

alphabet_order: [ "Cz", "Ch", "Sz", "Dz", "Dź", "Dż", "A", "B", "C", "Ć", "D", "E", "Ė", "F", "G", "H", "I", "J", "K", "L", "Ł", "M", "N", "Ń", "O", "Ö", "P", "R", "S", "Ś", "T", "U", "Ü", "W", "Y", "Z", "Ź", "Ż" ]

