id: karaim
enabled: false

name:
  ru: Караимский
  en: Karaim

# Опции <select> справа от строки поиска.
languages:
- { value: karaim, label: Кар, selected: true }
- { value: russian, label: Рус }

search:
  meta_language: russian # значение <select>, означающее язык перевода
  sentence_text_field: russian_text
  translation_field: translation
  lemma_field: lemma
  token_field: token

# Дополнительные буквы под строкой поиска.
keyboard:
- [ ć, ł, ń ]
- [ ö, ś, ż, ü ]

assets:
  styles: []
  scripts: []

