# Раскладка грамматического модала по колонкам: список id блоков.
layout:
  columns:
  - [ POS ]
  - [ Case, Tense, NounType ]
  - [ Mood, Aspect, Voice ]
  - [ "Number[word]", "Person[word]", "Number[psor]", "Person[psor]" ]
  - [ VerbForm, NumType, misc ]

grammar:
- id: POS
  match: any
  label: POS
  tooltip: Часть речи слова
  values:
  - { value: NOUN, label: NOUN, tooltip: Имя существительное }
  - { value: VERB, label: VERB, tooltip: Глагол }
  - { value: PRON, label: PRON, tooltip: Местоимение }
  - { value: ADP, label: ADP, tooltip: Послелог }
  - { value: ADJ, label: ADJ, tooltip: Имя прилагательное }
  - { value: ADV, label: ADV, tooltip: Наречие }
  - { value: PROPN, label: PROPN, tooltip: Имя собственное }
  - { value: NUM, label: NUM, tooltip: Имя числительное }
  - { value: DET, label: DET, tooltip: Детерминатив }
  - { value: AUX, label: AUX, tooltip: Вспомогательный глагол }
  - { value: INTJ, label: INTJ, tooltip: Междометие }
  - { value: CCONJ, label: CCONJ, tooltip: Сочинительный союз }
  - { value: PART, label: PART, tooltip: Частица }
  - { value: SCONJ, label: SCONJ, tooltip: Подчинительный союз }

- id: Case
  group: true
  match: any
  label: Case
  tooltip: Падеж
  values:
  - { value: Acc, label: Aсс, tooltip: Аккузатив, field: Case }
  - { value: Abl, label: Abl, tooltip: Аблатив, field: Case }
  - { value: Gen, label: Gen, tooltip: Генитив, field: Case }
  - { value: Loc, label: Loc, tooltip: Локатив, field: Case }
  - { value: Dat, label: Dat, tooltip: Датив, field: Case }
  - { value: Obl, label: Obl, tooltip: Обликвус, field: Case }
  - { value: Ins, label: Instr, tooltip: Инструменталис, field: Case }
  - { value: Abe, label: Abe, tooltip: Абессив, field: Case }
  - { value: Cmp, label: Comp, tooltip: Компаратив (степень сравнения), field: Degree }

- id: NounType
  match: any
  label: NounType
  tooltip: Тип номинализации
  values:
  - { value: Agent, label: Agent, tooltip: Агентивная }
  - { value: AbstrNoun, label: Abstr, tooltip: Абстрактное имя }

- id: VerbForm
  match: any
  label: VerbForm
  tooltip: Тип глагольной формы
  values:
  - { value: Inf, label: Inf, tooltip: Инфинитив }
  - { value: Conv, label: Conv, tooltip: Конверб }
  - { value: Part, label: Ptcp, tooltip: Причастие }
  - { value: VerbNoun, label: Nmn, tooltip: Отглагольное имя }

- id: Tense
  match: any
  label: Tense
  tooltip: Время
  values:
  - { value: Pres, label: Pres, tooltip: Настоящее }
  - { value: Past, label: Past, tooltip: Прошедшее }
  - { value: Fut, label: Fut, tooltip: Будущее }

- id: Mood
  match: any
  label: Mood
  tooltip: Наклонение
  values:
  - { value: Opt, label: Opt, tooltip: Оптатив }
  - { value: Hort, label: Hort, tooltip: Гортатив }
  - { value: Cnd, label: Cond, tooltip: Условное }
  - { value: Imp, label: Imp, tooltip: Императив }
  - { value: Pot, label: Pot, tooltip: Потенциалис }

- id: Aspect
  match: any
  label: Aspect
  tooltip: Вид
  values:
  - { value: Ant, label: Ant, tooltip: Предшествование }
  - { value: Sim, label: Sim, tooltip: Одновременность }
  - { value: Impf, label: Impf, tooltip: Имперфектив }

- id: "Number[word]"
  match: any
  label: Number
  tooltip: Число
  values:
  - { value: Sing, label: Sing, tooltip: Единственное }
  - { value: Plur, label: Plur, tooltip: Множественное }

- id: "Person[word]"
  match: any
  label: Person
  tooltip: Лицо главного слова
  values:
  - { value: "1", label: "1", tooltip: Первое лицо }
  - { value: "2", label: "2", tooltip: Второе лицо }
  - { value: "3", label: "3", tooltip: Третье лицо }

- id: "Number[psor]"
  match: any
  label: Number (possessor)
  tooltip: Число посессора
  values:
  - { value: Sing, label: Sing, tooltip: Единственное, field: "Number[psor]" }
  - { value: Plur, label: Plur, tooltip: Множественное, field: "Number[psor]" }

- id: "Person[psor]"
  match: any
  label: Person (possessor)
  tooltip: Лицо посессора
  values:
  - { value: "1", label: "1", tooltip: Первое лицо, field: "Person[psor]" }
  - { value: "2", label: "2", tooltip: Второе лицо, field: "Person[psor]" }
  - { value: "3", label: "3", tooltip: Третье лицо, field: "Person[psor]" }

- id: Voice
  group: true
  match: any
  label: Voice
  tooltip: Залог
  values:
  - { value: Caus, label: Caus, tooltip: Каузатив, field: Voice }
  - { value: Pass, label: Pass, tooltip: Пассив, field: Voice }
  - { value: "Yes", label: Rec, tooltip: Реципрок, field: Reciprocal }
  - { value: "Yes", label: Refl, tooltip: Рефлексив, field: Reflex }

- id: NumType
  match: any
  label: NumType
  tooltip: Тип числительного
  values:
  - { value: Ord, label: Ord, tooltip: Порядковое числительное }
  - { value: Sets, label: Collective num, tooltip: Собирательное числительное }
  - { value: Dist, label: Distr, tooltip: Дистрибутивное числительное }

- id: misc
  group: true
  label: Miscellaneous
  html_id: misc
  select_all: false
  values:
  - { value: Denom, label: Denom, tooltip: Отыменный глагол, field: VerbType }
  - { value: "Yes", label: Foc, tooltip: Фокус, field: Focus }
  - { value: Int, label: Q, tooltip: Вопросительная частица, field: PartType }
  - { value: Dim, label: Dim, tooltip: Диминутив, field: Degree }
  - { value: Neg, label: Neg, tooltip: Отрицание, field: Polarity }

ingest:
  script: latin
  strip_punct: [ token, lemma, segmentation ]
  strip_chars: ".,:;!?„”’‘‚\"«»()"
  spelling: { č: cz, Č: Cz, š: sz, Š: Sz, ű: ü, Ű: Ü, ő: ö, Ő: Ö }
  rename: { Person: "Person[word]", Number: "Number[word]" }
  drop_fields: [ parent_token_index, edge_type, constituents, constituent, sentence_tree, url, miscellaneous ]
