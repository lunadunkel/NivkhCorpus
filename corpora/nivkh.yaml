id: nivkh
enabled: true

name:
  ru: Нивхский
  en: Nivkh

# Опции <select> справа от строки поиска.
languages:
- { value: nivkh, label: Нивх, selected: true }
- { value: russian, label: Рус }

search:
  meta_language: russian # значение <select>, означающее язык перевода
  sentence_text_field: russian_text
  translation_field: translation
  lemma_field: lemma
  token_field: token
  person_object:
    # одна граммема, живущая в нескольких полях тегсета
    field: person_obj
    paths:
      clobj: "Person[clobj]"
      clpos: "Person[clpos]"

# Дополнительные буквы под строкой поиска.
keyboard:
- [ ӷ, ғ, ӻ, ӄ, "ӄ’" ]
- [ ӈ, "р̌", ў, ӽ, ӿ ]

assets:
  styles: []
  scripts: []

pages:
  search:
    template: search.html
    title: Корпус нивхского языка — НИВЦ МГУ
    description: >-
      Морфологический поиск по текстам на нивхском языке с разбором по частям речи, падежам и временам.
    og_description: >-
      Морфологический поиск по текстам на нивхском языке: по словоформе, лемме, части речи, падежу и времени.
    og_image_alt: Нивхский корпус — НИВЦ МГУ
    canonical: /nivkh
  about:
    template: about/nivkh.html
    title: О корпусе нивхского языка – НИВЦ МГУ
    description: >-
      Состав корпуса нивхского языка, источники текстов, принципы разметки и правила цитирования.
    og_description: >-
      Состав корпуса нивхского языка, источники текстов, принципы разметки и правила цитирования.
    og_image_alt: Нивхский корпус — НИВЦ МГУ
    canonical: /nivkh/about
    styles: [ "about.css" ]
  dictionary:
    template: dictionary.html
    title: Нивхско-русский словарь — НИВЦ МГУ
    description: >-
      Словник нивхского языка с переводами на русский. Поиск по букве и по лемме.
    og_description: >-
      Словник нивхского языка с переводами на русский. Поиск по букве и по лемме.
    og_image_alt: Нивхский корпус — НИВЦ МГУ
    canonical: /dictionary
    styles: [ "dictionary.css" ]
  search_output:
    template: search_output.html
    title: Результаты поиска — Нивхский корпус НИВЦ МГУ
  word:
    template: word.html
    title: Словарная статья — Нивхско-русский словарь
    description: >-
      Значения, переводы и грамматические пометы нивхского слова. Нивхский языковой корпус. 
    og_description: >-
      Словник нивхского языка с переводами на русский. Поиск по букве и по лемме.
    og_image_alt: Нивхский корпус — НИВЦ МГУ
    canonical: /dictionary/word
    styles: [ "letter.css" ]
  letter:
    template: letter.html
    title: Словарь по буквам — Нивхско-русский словарь
    description: >-
      Список нивхских слов на выбранную букву с переводами на русский.
    og_description: >-
      Список нивхских слов на выбранную букву с переводами на русский.
    og_image_alt: Нивхский корпус — НИВЦ МГУ
    styles: [ "letter.css" ]

